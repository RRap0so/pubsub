# Github action job to test core java library features on
# downstream client libraries before they are released.
on:
  push:
    branches:
      - main
  pull_request:
name: ci
jobs:
  units:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: ${{matrix.java}}
      - run: java -version
      - run: chmod +x .kokoro/*
      - run: .kokoro/build.sh
        env:
          JOB_TYPE: test
  windows:
    runs-on: windows-latest
    steps:
      - name: Support longpaths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: 8
      - run: java -version
      - run: chmod +x .kokoro/*
      - run: .kokoro/build.bat
        env:
          JOB_TYPE: test
  dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [8, 11]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: ${{matrix.java}}
      - run: java -version
      - run: chmod +x .kokoro/*
      - run: .kokoro/dependencies.sh
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: 11
      - run: java -version
      - run: chmod +x .kokoro/*
      - run: .kokoro/build.sh
        env:
          JOB_TYPE: lint
  flink-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHECKPOINT_TEST_EMULATOR: 127.0.0.1:8085
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: '17'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: pubsub-emulator
      - name: Start Pub/Sub emulator
        shell: bash
        run: |
          nohup gcloud beta emulators pubsub start \
            --project=checkpoint-repro --host-port="$CHECKPOINT_TEST_EMULATOR" --quiet \
            > "$RUNNER_TEMP/pubsub-emulator.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/pubsub-emulator.pid"
          for attempt in {1..120}; do
            if curl --silent --fail --max-time 1 \
                "http://$CHECKPOINT_TEST_EMULATOR/v1/projects/checkpoint-repro/topics" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/pubsub-emulator.log"
          exit 1
      - name: Verify Flink connector and recovery integration tests
        working-directory: flink-connector
        run: mvn -B -Precovery-it clean verify
      - name: Stop Pub/Sub emulator
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/pubsub-emulator.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/pubsub-emulator.pid")" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flink-recovery-results
          path: |
            flink-connector/flink-connector-gcp-pubsub/target/surefire-reports/
            flink-connector/flink-connector-gcp-pubsub/target/failsafe-reports/
            ${{ runner.temp }}/pubsub-emulator.log
